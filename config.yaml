# Configuración de JARVIS Assistant.
# Lo personal/secreto va en config.local.yaml o Credential Manager (gitignored).

# Perfil de hardware: auto | full | gpu-lite | cpu | minimal (docs/02 §6)
profile: auto

# Interfaz: bolita flotante y atajo global para abrir el asistente
ui:
  ball: true            # false = sin bolita (abre con el atajo)
  hotkey: ctrl+alt+j

# Entrada por voz (fase 5): "Hey Jarvis" + comando dictado.
voice:
  enabled: true
  # Micrófono: auto = el primero disponible de preferred_mics (o el
  # predeterminado de Windows). También vale un nombre del selector de Ajustes.
  mic: auto
  # Orden de preferencia con mic=auto (por trozo del nombre, da igual
  # mayúsculas): micro de la webcam (Trust USB) → Momentum 4 → Barracuda X.
  preferred_mics: [trust, webcam, momentum, barracuda]
  # Sensibilidad de "Hey Jarvis" (menor = más sensible). Calibrado con la
  # voz del usuario (01/09/2026): sus intentos puntúan 0.10-0.39 y el ruido
  # ambiente 0.00-0.02 → 0.10 los caza todos con margen sobre el ruido.
  # Si algún día salta solo, subir a 0.12-0.15.
  wake_threshold: 0.10
  # Con verificador entrenado (python -m jarvis.audio.voice --entrenar) el
  # score es la probabilidad de que seas TÚ diciéndolo. Validado 01/09/2026:
  # tomas del usuario 0.48-0.80, habla normal ≤0.01 → 0.45 lo coge todo.
  wake_threshold_verified: 0.45
  silence_ms: 800       # silencio que marca el final del comando
  max_command_s: 12     # tope de grabación por comando

# Salida hablada (Piper) — activable aunque se use solo la bolita.
# El interruptor y el volumen del panel se guardan en config.local.yaml.
tts:
  enabled: false
  volume: 80          # volumen de la voz del asistente (0-100)
  voice: es_ES-davefx-medium   # alternativa: es_ES-sharvard-medium
  # Palabras que la voz pronuncie mal → cómo decirlas
  replacements:
    cargando: "en carga"

# Ciudad para el tiempo (Open-Meteo). "auto" = detectar por IP;
# escribe un nombre de ciudad para fijarla.
city: auto

# Alias de programas: lo que dices → comando/ejecutable
apps:
  navegador: default-browser  # valor especial: el predeterminado del sistema
  explorador: explorer
  notas: notepad
  calculadora: calc

# Alias de carpetas: lo que dices → ruta (las estándar ya se conocen:
# descargas, documentos, escritorio, imágenes, música, vídeos).
# El resto de carpetas se buscan solas con Everything.
folders:
  proyectos: ~/Documents/Develop

# Alias de webs: lo que dices → URL
sites:
  correo: https://mail.google.com

# Perfiles de apps: "modo trabajo" abre todo esto de golpe
app_profiles:
  trabajo:
    - navegador
    - visual studio code

# Feeds RSS para "las noticias": nombre → URL
feeds:
  El País: https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/portada
  Xataka: https://www.xataka.com/feedburner.xml

# Correo enlazado: address/imap van a config.local.yaml desde Ajustes;
# la contraseña, al Almacén de credenciales de Windows (nunca a un fichero).

# Contactos para "envía un correo a mamá diciendo…": nombre → dirección
contacts: {}
#  mamá: ejemplo@gmail.com

# Teléfonos para "envía un whatsapp a mamá diciendo…": nombre → número
# (sin prefijo se asume +34)
phones: {}
#  mamá: 612345678
