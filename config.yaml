# Configuración de JARVIS Assistant.
# Lo personal/secreto va en config.local.yaml o Credential Manager (gitignored).

# Perfil de hardware: auto | full | gpu-lite | cpu | minimal (docs/02 §6)
profile: auto

# Salida hablada (Piper) — activable aunque se use solo la bolita.
# El interruptor y el volumen del panel se guardan en config.local.yaml.
tts:
  enabled: false
  volume: 80          # volumen de la voz del asistente (0-100)
  voice: es_ES-davefx-medium   # alternativa: es_ES-sharvard-medium
  # Palabras que la voz pronuncie mal → cómo decirlas
  replacements:
    cargando: "en carga"

# Ciudad para el tiempo (Open-Meteo). "auto" = detectar por IP;
# escribe un nombre de ciudad para fijarla.
city: auto

# Alias de programas: lo que dices → comando/ejecutable
apps:
  navegador: default-browser  # valor especial: el predeterminado del sistema
  explorador: explorer
  notas: notepad
  calculadora: calc

# Alias de carpetas: lo que dices → ruta (las estándar ya se conocen:
# descargas, documentos, escritorio, imágenes, música, vídeos).
# El resto de carpetas se buscan solas con Everything.
folders:
  proyectos: ~/Documents/Develop

# Alias de webs: lo que dices → URL
sites:
  correo: https://mail.google.com

# Perfiles de apps: "modo trabajo" abre todo esto de golpe
app_profiles:
  trabajo:
    - navegador
    - visual studio code
