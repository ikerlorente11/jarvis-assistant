# Catálogo de intents (docs/01): alimenta el router fast path Y los menús
# de la bolita. Skill nueva = entrada aquí + módulo en jarvis/skills/.
#
# Formato de cada intent:
#   id:           único, estable (lo usa la UI para dispatch directo)
#   label:        texto del menú; con {slot} se pide el valor al usuario
#   description:  qué hace — tooltip del botón y texto del diálogo del slot
#   patterns:     frases para el matching (regex si llevan {slot}, fuzzy si no)
#   skill:        modulo.funcion dentro de jarvis/skills/
#   params:       argumentos fijos opcionales; el {slot} llega como argumento extra
#   options_from: clave de config.yaml cuyas claves se ofrecen como opciones

categories:
  informacion:
    label: Información
    icon: "💡"
    intents:
      - id: hora
        label: "¿Qué hora es?"
        description: "Dice la hora actual."
        patterns: ["qué hora es", "dime la hora", "la hora"]
        skill: datetime_info.hora
      - id: fecha
        label: "¿Qué día es hoy?"
        description: "Dice el día de la semana y la fecha."
        patterns: ["qué día es hoy", "qué fecha es", "dime la fecha"]
        skill: datetime_info.fecha
      - id: tiempo
        label: "¿Qué tiempo hace?"
        description: "Tiempo actual en tu ciudad (detectada por IP, o `city` de config.yaml)."
        patterns: ["qué tiempo hace", "qué tal tiempo hace", "el tiempo", "va a llover"]
        skill: weather.hoy
      - id: tiempo_ciudad
        label: "Tiempo en… {ciudad}"
        description: "Tiempo actual en la ciudad que digas."
        patterns: ["qué tiempo hace en {ciudad}", "tiempo en {ciudad}"]
        skill: weather.hoy
      - id: tiempo_prevision
        label: "Previsión de… {dias} días"
        description: "Previsión diaria (mín-máx, cielo y lluvia). ¿Cuántos días? (1-14)"
        patterns:
          - "previsión de {dias} días"
          - "previsión para {dias} días"
          - "tiempo para los próximos {dias} días"
          - "qué tiempo hará estos {dias} días"
        skill: weather.prevision
      - id: noticias
        label: "Las noticias"
        description: "Titulares de tus feeds RSS (configurables en `feeds` de config.yaml)."
        patterns: ["las noticias", "dame las noticias", "qué ha pasado hoy", "titulares"]
        skill: news.titulares
      - id: convertir
        label: "Convertir: {expresion}"
        description: "Convierte unidades. Ej.: 10 km a millas, 100 f a c, 2 libras a kg."
        patterns: ["convierte {expresion}", "cuánto es {expresion}", "cuántos son {expresion}"]
        skill: convert.convertir
      - id: bateria
        label: "Batería"
        description: "Nivel de batería y tiempo restante estimado."
        patterns: ["cuánta batería queda", "batería", "nivel de batería"]
        skill: system.bateria

  programas:
    label: Programas
    icon: "🚀"
    intents:
      - id: abrir_programa
        label: "Abrir programa: {app}"
        description: "Abre un programa instalado; no hace falta el nombre exacto (busca por aproximación)."
        patterns: ["abre {app}", "abrir {app}", "ábreme {app}", "abre el {app}", "abre la {app}"]
        skill: apps.abrir
      - id: abrir_navegador
        label: "Abrir el navegador"
        description: "Abre tu navegador predeterminado."
        patterns: ["abre el navegador", "abrir navegador"]
        skill: apps.abrir
        params: { app: navegador }
      - id: abrir_web
        label: "Abrir web: {url}"
        description: "Abre una dirección o alias; admite «… en la pantalla principal/secundaria» y «… en una ventana nueva». Si no parece una dirección, lo busca."
        patterns: ["abre la web {url}", "abre la página {url}", "ve a {url}", "entra en {url}"]
        skill: web.abrir
      - id: buscar_web
        label: "Buscar en internet: {consulta}"
        description: "Busca en el navegador; admite «… en la pantalla principal/secundaria» y «… en una ventana nueva»."
        patterns:
          - "busca en internet {consulta}"
          - "busca en el navegador {consulta}"
          - "busca en google {consulta}"
          - "búscame {consulta}"
        skill: web.buscar
      - id: modo
        label: "Activar modo: {perfil}"
        description: "Abre de golpe los programas de un perfil (definidos en `app_profiles` de config.yaml)."
        options_from: app_profiles
        patterns: ["modo {perfil}", "activa el modo {perfil}", "ponte en modo {perfil}"]
        skill: apps.modo

  archivos:
    label: Archivos
    icon: "📁"
    intents:
      - id: abrir_carpeta
        label: "Abrir carpeta: {carpeta}"
        description: "Abre una carpeta por nombre: estándar (descargas…), alias de config, o la busca con Everything."
        options_from: folders
        patterns: ["abre la carpeta {carpeta}", "abrir carpeta {carpeta}", "abre la carpeta de {carpeta}"]
        skill: folders.abrir
      - id: abrir_descargas
        label: "Abrir Descargas"
        description: "Abre tu carpeta de Descargas."
        patterns: ["abre descargas", "abre las descargas"]
        skill: folders.abrir
        params: { carpeta: descargas }
      - id: buscar_archivo
        label: "Buscar archivo: {texto}"
        description: "Busca archivos y carpetas por nombre con Everything (instantáneo) y lista los primeros."
        patterns: ["busca {texto}", "busca el archivo {texto}", "encuentra {texto}"]
        skill: files.buscar
      - id: abrir_archivo
        label: "Abrir archivo: {texto}"
        description: "Busca un archivo por nombre y abre directamente el que mejor encaje."
        patterns: ["abre el archivo {texto}", "abre el fichero {texto}"]
        skill: files.abrir

  sistema:
    label: Sistema
    icon: "⚙️"
    intents:
      - id: volumen_subir
        hidden: true
        label: "Subir volumen"
        description: "Sube el volumen un 10%."
        patterns: ["sube el volumen", "más volumen", "sube volumen"]
        skill: system.volumen_subir
      - id: volumen_bajar
        hidden: true
        label: "Bajar volumen"
        description: "Baja el volumen un 10%."
        patterns: ["baja el volumen", "menos volumen", "baja volumen"]
        skill: system.volumen_bajar
      - id: volumen_poner
        hidden: true
        label: "Volumen al… {nivel}"
        description: "Pone el volumen a un porcentaje exacto (0-100)."
        patterns: ["volumen al {nivel}", "pon el volumen al {nivel}"]
        skill: system.volumen_poner
      - id: silenciar
        hidden: true
        label: "Silenciar / activar sonido"
        description: "Alterna el silencio del sistema."
        patterns: ["silencio", "silénciate", "mute", "activa el sonido", "quita el silencio"]
        skill: system.silenciar
      - id: play_pausa
        hidden: true
        label: "Play / pausa"
        description: "Pulsa la tecla multimedia play/pausa (Spotify, YouTube…)."
        patterns: ["pausa", "play", "reproduce", "para la música", "reanuda"]
        skill: media.play_pausa
      - id: siguiente
        hidden: true
        label: "Siguiente canción"
        description: "Pasa a la siguiente pista del reproductor activo."
        patterns: ["siguiente", "siguiente canción", "pasa la canción"]
        skill: media.siguiente
      - id: anterior
        hidden: true
        label: "Canción anterior"
        description: "Vuelve a la pista anterior del reproductor activo."
        patterns: ["anterior", "canción anterior", "vuelve a la canción"]
        skill: media.anterior
      - id: voz_activar
        hidden: true
        label: "Activar la voz"
        description: "El asistente lee las respuestas en voz alta (Piper)."
        patterns: ["activa la voz", "habla", "lee las respuestas"]
        skill: speech.activar
      - id: voz_desactivar
        hidden: true
        label: "Desactivar la voz"
        description: "El asistente deja de leer las respuestas."
        patterns: ["desactiva la voz", "cállate", "deja de hablar", "no hables"]
        skill: speech.desactivar
      - id: voz_volumen
        hidden: true
        label: "Voz al… {nivel}"
        description: "Volumen de la voz del asistente, 0-100 (no el del sistema)."
        patterns: ["voz al {nivel}", "pon la voz al {nivel}", "volumen de la voz al {nivel}"]
        skill: speech.volumen
      - id: captura
        label: "Captura de pantalla"
        description: "Captura todos los monitores y la guarda en Imágenes\\Capturas."
        patterns: ["haz una captura", "captura de pantalla", "pantallazo"]
        skill: system.captura
      - id: minimizar
        label: "Minimizar todo"
        description: "Minimiza todas las ventanas y muestra el escritorio."
        patterns: ["minimiza todo", "minimiza las ventanas", "enséñame el escritorio"]
        skill: system.minimizar_todo

  productividad:
    label: Productividad
    icon: "📝"
    intents:
      - id: timer
        label: "Avísame en… {tiempo}"
        description: "Temporizador con notificación de Windows. Ej.: 10 minutos, 30 segundos, 1 hora."
        patterns: ["avísame en {tiempo}", "temporizador de {tiempo}", "pon un temporizador de {tiempo}"]
        skill: timers.crear
      - id: recordatorio_crear
        label: "Recuérdame: {texto}"
        description: "Recordatorio con aviso (sobrevive a reinicios). Ej.: llamar al médico en 2 horas · sacar la basura a las 21:30 · revisar correo mañana a las 9"
        patterns: ["recuérdame {texto}", "recuérdame que {texto}", "recuerda que {texto}"]
        skill: reminders.crear
      - id: recordatorio_listar
        label: "Mis recordatorios"
        description: "Lista los recordatorios pendientes, numerados."
        patterns: ["mis recordatorios", "qué recordatorios tengo", "lista los recordatorios"]
        skill: reminders.listar
      - id: recordatorio_borrar
        label: "Borrar recordatorio: {numero}"
        description: "Borra un recordatorio por su número (míralos en «Mis recordatorios»)."
        patterns: ["borra el recordatorio {numero}", "quita el recordatorio {numero}"]
        skill: reminders.borrar
      - id: nota_crear
        label: "Apuntar nota: {texto}"
        description: "Añade una nota con fecha a Documentos\\notas-jarvis.md."
        patterns: ["apunta {texto}", "apunta que {texto}", "toma nota de {texto}"]
        skill: notes.crear
      - id: nota_leer
        label: "Leer mis notas"
        description: "Muestra las últimas 5 notas apuntadas."
        patterns: ["lee mis notas", "qué notas tengo", "mis notas"]
        skill: notes.leer
      - id: portapapeles
        label: "Leer el portapapeles"
        description: "Muestra lo último que has copiado."
        patterns: ["lee el portapapeles", "qué he copiado", "lee lo que he copiado"]
        skill: clipboard.leer

  personalizar:
    label: Personalizar
    icon: "🛠️"
    intents:
      - id: alias_agregar
        label: "Añadir alias: {datos}"
        description: "«nombre -> destino»: contacto (email), web (dominio), carpeta (ruta) o programa. Ej.: Ainhoa -> noah@gmail.com"
        patterns:
          - "añade el alias {datos}"
          - "añade un alias {datos}"
          - "crea el alias {datos}"
          - "añade el contacto {datos}"
          - "añade un contacto {datos}"
          - "guarda el contacto {datos}"
        skill: customize.alias
      - id: modo_crear
        label: "Crear modo: {datos}"
        description: "«nombre con orden1, orden2…»: cada orden es un comando del asistente. Ej.: arranca con youtube.com y el tiempo en logroño"
        patterns:
          - "crea el modo {datos}"
          - "crea un modo {datos}"
          - "nuevo modo {datos}"
          - "añade el modo {datos}"
        skill: customize.modo
      - id: personalizacion_ver
        label: "Ver mi personalización"
        description: "Muestra tus contactos, alias, webs, carpetas y modos guardados."
        patterns: ["mis alias", "mis contactos", "qué modos tengo", "mi personalización"]
        skill: customize.ver

  comunicacion:
    label: Comunicación
    icon: "📧"
    intents:
      - id: correo_leer
        label: "¿Tengo correos nuevos?"
        description: "Lista remitente y asunto de los correos sin abrir (⚙ Ajustes para enlazar)."
        patterns: ["tengo correos nuevos", "correos nuevos", "revisa el correo"]
        skill: mail.leer
      - id: correo_ultimo
        label: "Leer el último correo"
        description: "Lee el último correo recibido y te resume de qué trata y si pide hacer algo."
        patterns:
          - "lee el último correo"
          - "léeme el último correo"
          - "qué dice el último correo"
          - "de qué trata el último correo"
          - "lee mi último correo"
        skill: mail.ultimo
      - id: correo_de
        label: "Correos de… {remitente}"
        description: "Busca correos de un remitente (nombre o dirección) y lista los últimos, marcando los no leídos."
        patterns:
          - "tengo algún correo de {remitente}"
          - "tengo correos de {remitente}"
          - "hay correo de {remitente}"
          - "busca correos de {remitente}"
          - "correos de {remitente}"
        skill: mail.de_remitente
      - id: correo_enviar
        label: "Enviar correo: {peticion}"
        description: "Redacta el correo y te lo enseña antes de enviar. Admite «bonito» (HTML con estilo) y «con el archivo X adjunto» (lo busca solo). Ej.: a maria@x.com diciendo que llego tarde"
        patterns:
          - "envía un correo {peticion}"
          - "manda un correo {peticion}"
          - "escribe un correo {peticion}"
          - "envía un email {peticion}"
          - "envía un mail {peticion}"
          - "manda un mail {peticion}"
        skill: mail.redactar
      - id: correo_enviarme
        label: "Enviarme un correo: {peticion}"
        hidden: true
        description: "Redacta y envía un correo a la propia cuenta enlazada del usuario (recordatorios, notas, enlaces…)."
        patterns:
          - "envíame un correo {peticion}"
          - "mándame un correo {peticion}"
          - "envíame un email {peticion}"
          - "mándame un email {peticion}"
          - "envíame un mail {peticion}"
          - "mándame un mail {peticion}"
        skill: mail.redactar
        params: { para_mi: "si" }
      - id: correo_confirmar
        label: "Confirmar envío"
        hidden: true
        no_tool: true  # confirmar es SIEMPRE del humano, nunca del LLM
        description: "Envía el borrador pendiente."
        patterns: ["envíalo", "mándalo", "confirma el envío", "sí envíalo"]
        skill: mail.confirmar
      - id: correo_cancelar
        label: "Descartar borrador"
        hidden: true
        description: "Descarta el borrador pendiente."
        patterns: ["no lo envíes", "descarta el correo", "cancela el correo"]
        skill: mail.cancelar
